#      - postgres
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready", "-d", "postgres"]
#      interval: 30s
#      timeout: 60s
#      retries: 5
#      start_period: 80s
      
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres:
    external: true
