version: "3"

services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    #    image: painel-precos-backend:local
    #  image: ghcr.io/ttsolutionspi/painel-precos-backend:1.0.27
    #  platform: linux/amd64
    environment:
      TZ: America/Fortaleza
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ${LUCENE_HOST_DIR:-lucene-indexes}:${LUCENE_INDEX_DIR:-/lucene/indexes/}

  postgres:
    image: postgres:15.3
    shm_size: 1g
    volumes:
      - postgres-mural:/var/lib/postgresql/data
      # - ./docker-postgres-initdb.sql:/docker-entrypoint-initdb.d/docker-postgres-initdb.sql
    environment:
      POSTGRES_DB: muralpreco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'

