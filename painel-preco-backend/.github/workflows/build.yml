name: Publish Docker image (Spring Boot)

on:
  workflow_dispatch:

jobs:
  build_and_push:
    name: Build, Push and Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Extract version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Build project (Maven)
        run: mvn clean package -DskipTests

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ttsolutionspi/painel-precos-backend:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/ttsolutionspi/painel-precos-backend:latest
          build-args: |
            JAR_FILE=target/*.jar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push Git tag
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          git fetch --tags
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" -m "Release version $TAG"
            git push origin "$TAG"
            echo "Tag $TAG created and pushed."
          fi
