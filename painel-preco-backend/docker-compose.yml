version: "3"

services:
  app:
    image: ghcr.io/ttsolutionspi/docker-images/painel-precos-backend:latest
    environment:
      TZ: America/Fortaleza 
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
      
  postgres:
    image: postgres:15.3
    shm_size: 1g
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker-postgres-initdb.sql:/docker-entrypoint-initdb.d/docker-postgres-initdb.sql
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
      
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

  keycloak:
    image: keycloak/keycloak:22.0.1
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_DB_SCHEMA: public
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - 8280:8080
    depends_on:
      - postgres

volumes:
  postgres:
    external: true
