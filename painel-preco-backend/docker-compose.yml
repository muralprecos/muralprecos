version: "3"

services:
#  app:
#    image: github.com/euclydesmelo/images/painel-precos-backend:1.0.0
#    environment:
#      TZ: America/Fortaleza 
#    ports:
#      - "8080:8080"
#    env_file: .env
#    depends_on:
#      - postgres
      
  postgres:
    image: postgres:15.3
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker-postgres-initdb.sql:/docker-entrypoint-initdb.d/docker-postgres-initdb.sql
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
      
  keycloak:
    image: keycloak/keycloak:22.0.1
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: public
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
    ports:
      - 8280:8080
    depends_on:
      - postgres
      
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres:
    external: true