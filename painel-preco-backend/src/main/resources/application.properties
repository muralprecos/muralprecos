# SERVICE SETTINGS
spring.application.name=${APP_NAME:mural-preco}
spring.aop.auto=false
spring.profiles.active=sso-security
spring.jackson.time-zone=Brazil/East
spring.jackson.locale=pt-BR
server.max-http-header-size=500KB

#SPRING LOG SETTINGS
logging.level.root=${LOG_LEVEL:info}
logging.level.org.springframework.web=${LOG_LEVEL:info}
logging.level.org.springframework.security=${LOG_LEVEL:info}
logging.level.org.springframework.transaction.interceptor=${LOG_LEVEL:info}
logging.level.org.hibernate.SQL=${LOG_LEVEL:debug}
logging.level.org.hibernate.type=${LOG_LEVEL:debug}

# JPA SETTINGS
spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.default_schema=mural
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none

# DATASOURCE SETTINGS
spring.datasource.platform=postgres
spring.database.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/muralpreco
spring.datasource.username=${APP_DB_USER:postgres}
spring.datasource.password=${APP_DB_PASSWD:postgres}
spring.jpa.properties.hibernate.dialect=br.com.tt.painelpreco.config.PostgreSQL10CustomDialect

# HikariCP settings
spring.datasource.jdbcUrl=${spring.datasource.url}
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.poolName=HikariPoolPostgresSQL

spring.jpa.properties.hibernate.jdbc.batch_size = 50
spring.jpa.properties.hibernate.order_inserts = true

# HIBERNATE SEARCH SETTINGS (LUCENE INDEXES DIRECTORY)
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=${LUCENE_INDEX_DIR:/lucene/indexes/}

# Timeout de conexao: tempo que o Feign espera para estabelecer a conexao (em milissegundos).
# Exemplo: 5 segundos
feign.client.config.default.connectTimeout=10000

# Timeout de leitura (Read Timeout): tempo que o Feign espera para receber dados apos a conexao ter sido estabelecida.
# Este eh o timeout mais importante para APIs lentas.
# Exemplo: 60 segundos
feign.client.config.default.readTimeout=120000

pncp.api.key=${PNCP_API_KEY}
pncp.api.output.dir=${PNCP_API_OUTPUT_DIR:/home/euclydes/pncp/output/}
pncp.api.schedule.cron=${PNCP_API_CRON_EXPRESSION:0 0 0 * * *}
pncp.api.coletor.startup=${PNCP_API_COLETOR_STARTUP:false}
pncp.api.coletor.licitacoesOnly=${PNCP_API_COLETOR_LICITACOES_ONLY:false}
pncp.api.coleta.data-inicio=${PNCP_COLETA_DATA_INICIO:2022-01-01}
pncp.coleta.num-threads=${PNCP_COLETA_NUM_THREADS:8}
pncp.coleta.fornecedores.max-duration-hours=${PNCP_COLETA_FORNECEDORES_MAX_HORAS:18}
pncp.coleta.atas.max-duration-hours=${PNCP_COLETA_ATAS_MAX_HORAS:4}
lucene.startup=${LUCENE_INDEX_STARTUP:false}

# SERVER SETTINGS
server.servlet.context-path=${CONTEXT_PATH:/} 
server.port=8080

# KEYCLOAK SETTINGS
keycloak.auth-server-url=${SSO_AUTH_SERVER:http://localhost:8280}
keycloak.realm=${SSO_REALM:ttsolutions}
keycloak.resource=${SSO_RESOURCE:mural-preco}
keycloak.bearer-only=true
keycloak.principal-attribute=preferred_username
keycloak.cors=true
keycloak.ssl-required=none
keycloak.credentials.secret=${SSO_SECRET}
keycloak.enabled=true

# FLYWAY SETTINGS
spring.flyway.url=jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/muralpreco
spring.flyway.schemas=mural
spring.flyway.user=${APP_DB_USER:postgres}
spring.flyway.password=${APP_DB_PASSWD:postgres}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# SPRING CACHE REDIS SETTINGS
spring.cache.type=redis

# REDIS SETTINGS
spring.redis.host=${APP_REDIS_HOST:localhost}
spring.redis.port=${APP_REDIS_PORT:6379}
spring.cache.redis.time-to-live=86400000

# APP SETTINGS
app.api.resource.public=/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**,/serverapi/v1/auth/logon,/serverapi/v1/auth/refresh,/serverapi/v1/auth/logout,/serverapi/v1/itens-licitacao/unauth/**,/serverapi/v1/**/validar,/serverapi/v1/**/validacao,/serverapi/v1/coleta/pncp/**
app.domain=https://muraldeprecos.com

# SPRING DOCS SETTINGS
springdoc.packages-to-scan=br.com.tt.painelpreco.api


keycloak-admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak-admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak-admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}