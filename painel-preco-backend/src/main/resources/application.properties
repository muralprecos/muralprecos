# SERVICE SETTINGS
spring.application.name=${APP_NAME:painel-preco}
spring.aop.auto=false
spring.profiles.active=sso-security
spring.jackson.time-zone=Brazil/East
spring.jackson.locale=pt-BR

# JPA SETTINGS
spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.default_schema: painel
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

# DATASOURCE SETTINGS
spring.datasource.platform=postgres
spring.database.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/painel_preco
spring.datasource.username=${APP_DB_USER:postgres}
spring.datasource.password=${APP_DB_PASSWD:postgres}

# SERVER SETTINGS
server.servlet.context-path=${CONTEXT_PATH:/} 
server.port=8080

# KEYCLOAK SETTINGS
keycloak.auth-server-url=${SSO_AUTH_SERVER:http://localhost:8280/auth}
keycloak.realm=${SSO_REALM:tt}
keycloak.resource=${SSO_RESOURCE:painel}
keycloak.bearer-only=true
keycloak.principal-attribute=preferred_username
keycloak.cors=true
keycloak.ssl-required=none
keycloak.credentials.secret=${SSO_SECRET}
keycloak.enabled=true

# FLYWAY SETTINGS
spring.flyway.url=jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/painel_preco
spring.flyway.schemas=painel
spring.flyway.user=${APP_DB_USER:postgres}
spring.flyway.password=${APP_DB_PASSWD:postgres}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# REDIS SETTINGS
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379

# APP SETTINGS
app.api.resource.public=/api/v1/auth,/api/v1/**