version: '3.8'

volumes:
  frontend-data:

services:
  app-front:
    image: painel-precos-frontend-local:latest
    # image: ghcr.io/ttsolutionspi/painel-precos-frontend:latest
    container_name: painel_precos_app_front
    # build:
    #   context: ./
    #   dockerfile: Dockerfile
    volumes:
        - /app/public
        - /app/node_modules
        - /app/.next
        # - ./logs:/appserverlogs
        - ./.env:/app/.env
    ports:
      - "3000:3000"
