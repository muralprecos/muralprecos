version: '3.8'

volumes:
  frontend-data:

services:
  app-front:
    image: painelpreco-frontend-test:latest
    # image: ghcr.io/ttsolutionspi/painel-precos-frontend:latest
    container_name: painel_precos_app_front
    volumes:
        - /app/public
        - /app/node_modules
        - /app/.next
        - ./logs:/appserverlogs
        - ./.env.local:/app/.env.local
    ports:
      - "3000:3000"
