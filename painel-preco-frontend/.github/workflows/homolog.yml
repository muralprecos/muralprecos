name: Publish Docker image (Homolog)

on:
  push:
    branches:
      - homolog
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Build, Push and Tag (Homolog)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out the repo (homolog)
        uses: actions/checkout@v4
        with:
          ref: homolog

      - name: Extract version from package.json
        id: get_version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
      
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.0

      - name: Build and push Docker image (homolog)
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.get_version.outputs.VERSION }}
            AUTH_SECRET=${{ secrets.HMG_AUTH_SECRET }}
            KEYCLOAK_ID=${{ secrets.HMG_KEYCLOAK_ID }}
            KEYCLOAK_SECRET=${{ secrets.HMG_KEYCLOAK_SECRET }}
            API_URL=https://qa.api.muraldeprecos.com
            API_URL_PREFIX=/serverapi/v1
            KEYCLOAK_ISSUER=https://qa.auth.muraldeprecos.com/realms/ttsolutionsqa
            GET_TOKEN_URL=https://qa.auth.muraldeprecos.com/realms/ttsolutionsqa/protocol/openid-connect/token
            REFRESH_TOKEN_URL=https://qa.auth.muraldeprecos.com/realms/ttsolutionsqa/protocol/openid-connect/token
            END_SESSION_URL=https://qa.auth.muraldeprecos.com/realms/ttsolutionsqa/protocol/openid-connect/logout
            CHECK_SESSION_URL=https://qa.auth.muraldeprecos.com/realms/ttsolutionsqa/protocol/openid-connect/userinfo
            KEYCLOAK_ADMIN=https://qa.auth.muraldeprecos.com/admin/realms/ttsolutionsqa
          tags: |
            ghcr.io/ttsolutionspi/painel-precos-frontend:${{ steps.get_version.outputs.VERSION }}-HMG
            ghcr.io/ttsolutionspi/painel-precos-frontend:hmg
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push Git tag (homolog)
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}-HMG"
          git fetch --tags
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" -m "Homolog release version $TAG"
            git push origin "$TAG"
            echo "Tag $TAG created and pushed."
          fi
