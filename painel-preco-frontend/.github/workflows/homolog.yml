name: Publish Docker image (Homolog)

on:
  push:
    branches:
      - homolog
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Build, Push and Tag (Homolog)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repo (homolog)
        uses: actions/checkout@v4
        with:
          ref: homolog

      - name: Extract version from package.json
        id: get_version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
      
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (homolog)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ttsolutionspi/painel-precos-frontend:${{ steps.get_version.outputs.VERSION }}-HMG
            ghcr.io/ttsolutionspi/painel-precos-frontend:hmg
          cache-from: type=gha
          cache-to: type=gha,mode=max
